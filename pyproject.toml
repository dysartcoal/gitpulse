[project]
name = "gitpulse"
version = "0.1.0"
description = "GitPulse Phase 1: NiFi/Kafka ingestion of public GitHub activity events"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.5",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "testcontainers[kafka]>=4.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
