# Single source of truth for GitHub event type -> Kafka topic routing.
# Read natively by NiFi (PropertiesFileLookupService, T009) and by the
# Python consumer (topic_map.py, this task) - not duplicated between them.
#
# `default` is the fallback topic for any event type not listed below
# (e.g. a new GitHub event type introduced after this file was written).
# Per data-model.md, an unrecognized type is still structurally valid and
# must not be dropped or quarantined - it goes to the fallback topic.
#
# The three-category split below (code/discussion/review) is a task-level
# judgment call (research.md: "decide once you see real volume", not fixed
# by the spec) - one topic per broad category keeps consumer logic
# type-aware without needing a topic per individual GitHub event type
# (~15+ of them). Some placements are genuinely borderline (e.g. GollumEvent,
# a wiki edit, filed under discussion rather than code) - re-bucket freely
# once real traffic volume makes a different split more sensible.

default=github-events.other-activity

# --- Code activity ---
PushEvent=github-events.code-activity
CreateEvent=github-events.code-activity
DeleteEvent=github-events.code-activity
ForkEvent=github-events.code-activity
ReleaseEvent=github-events.code-activity
PublicEvent=github-events.code-activity

# --- Discussion activity ---
IssuesEvent=github-events.discussion-activity
IssueCommentEvent=github-events.discussion-activity
CommitCommentEvent=github-events.discussion-activity
GollumEvent=github-events.discussion-activity
MemberEvent=github-events.discussion-activity
WatchEvent=github-events.discussion-activity
SponsorshipEvent=github-events.discussion-activity

# --- Review activity ---
PullRequestEvent=github-events.review-activity
PullRequestReviewEvent=github-events.review-activity
PullRequestReviewCommentEvent=github-events.review-activity
PullRequestReviewThreadEvent=github-events.review-activity
