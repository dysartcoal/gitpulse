# Local, zero-ongoing-cost NiFi + Kafka stack (ADR-0003, ADR-0005).
# Kafka runs in KRaft mode - no separate ZooKeeper container.
#
# GITHUB_TOKEN (optional): export it in your shell, or put it in a .env file
# next to this compose file, before `docker compose up`. Unset, NiFi's
# InvokeHTTP falls back to unauthenticated polling (60 req/hour instead of
# 5,000 - see research.md).

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: gitpulse-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: gitpulse-kraft-cluster-1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  nifi:
    image: apache/nifi:1.27.0
    container_name: gitpulse-nifi
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8443:8443"
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_ADMIN_PASSWORD:-gitpulse-local-12345}
      # Passed through so the flow's Parameter Context (T009) can read it via
      # NiFi's EnvironmentVariableParameterProvider. Empty is fine - unauthenticated.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-state:/opt/nifi/nifi-current/state
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/nifi/ | grep -q 200 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  kafka-data:
  nifi-conf:
  nifi-state:
